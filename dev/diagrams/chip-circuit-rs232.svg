<svg xmlns="http://www.w3.org/2000/svg" width="880" height="739" viewBox="0 0 880 739" role="img" aria-labelledby="chip-circuit-rs232-title chip-circuit-rs232-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-rs232-title">BASIS 2: RS-232 point to point</title>
<desc id="chip-circuit-rs232-desc">Schematic of the BASIS 2 rs-232 point to point: the chip with U2 MCU, U3 RS-232 level shifter, J1 12 to 24 V supply; the MCU wires carry the port hooks Read(), Write().</desc>
<rect x="0.5" y="0.5" width="879" height="738" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">BASIS 2: RS-232 point to point</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One instrument on an RS-232 port. The instrument's levels are RS-232, so a TTL UART needs a level shifter;</text>
<text x="32" y="125.5" font-size="15" fill="#566070">the shifter is general practice: the manual gives no TTL option. The MCU's TX goes through the shifter to</text>
<text x="32" y="147.3" font-size="15" fill="#566070">pin 5 (the instrument receives) and pin 6 comes back through it to the MCU's RX. This is unverified: the</text>
<text x="32" y="169.1" font-size="15" fill="#566070">manual's pin table lists "Rx" and "Tx" without saying whose side they name. Above each MCU wire: the port</text>
<text x="32" y="190.8" font-size="15" fill="#566070">hook that drives it. Datasheet: Power and Signal Connections, pin table, p. 7.</text>

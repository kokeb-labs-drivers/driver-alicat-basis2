<text x="363.4" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Execute(request, timing)</text>
<text x="396.3" y="321.9" font-size="13" fill="#8A3C0B">wait t3.5 of silence</text>

<title id="one-call-through-the-layers-title">One call through the layers</title>
<desc id="one-call-through-the-layers-desc">One ReadFlow call: the device class builds the request, the bus layer waits for silence, writes it through your port and reads until a carriage return, and the reply is checked and decoded into a flow value.</desc>

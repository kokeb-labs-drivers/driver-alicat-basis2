<svg xmlns="http://www.w3.org/2000/svg" width="640" height="664" viewBox="0 0 640 664" role="img" aria-labelledby="uart-timing-title uart-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="uart-timing-title">UART character</title>
<desc id="uart-timing-desc">One serial character of the BASIS 2 at its factory settings: a start bit, eight data bits least significant first and one stop bit with no parity, at 38400 bit/s unless the baud rate was changed.</desc>

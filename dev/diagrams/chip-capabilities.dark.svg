<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1168" viewBox="0 0 1200 1168" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the BASIS 2 does</title>
<desc id="chip-capabilities-desc">Capability map of the BASIS 2: Flow, temperature and total (supported): Polls the whole data frame or single items and decodes each number exactly; Setpoint, ramp and watchdog (supported): Sets the flow of a controller, limits how fast it changes and closes the valve if the line goes quiet; Valve hold and loop gains (supported): Holds the valve at a fixed drive, opens or closes it, and tunes the closed loop; Tare and autotare (supported): Zeroes the flow reading at no flow, and on a controller zeroes it again at a closed setpoint; Gas selection (supported): Selects one of the nine calibrated gases and lists the gases the instrument holds; Totalizer and batch (supported): Counts the gas that has passed, sets what happens at the limit, and dispenses a set volume; Measurement window (supported): Starts a timed measurement, by command or by an event, and reads its averages and ranges; Unit ID, baud and protocol (guarded): Changes the unit ID, address, baud rate or protocol, restores factory settings, and scans a line; Analog setpoint and output (not covered): A 0 to 5 V or 4 to 20 mA setpoint input and flow output on pins 1 and 2, wired outside the driver.</desc>

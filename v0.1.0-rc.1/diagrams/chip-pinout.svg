<text x="380" y="293.6" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">BASIS 2 (B and BC series)</text>
<text x="380" y="317.6" font-size="13" text-anchor="middle" fill="#566070">JST GH 6-pin connector, top view</text>
<text x="235" y="222.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#86198F">1</text>
<text x="210" y="223.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">A-SET*</text>
<text x="235" y="256.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#86198F">2</text>
<text x="210" y="257.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">A-OUT*</text>
<text x="235" y="290.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">3</text>
<text x="210" y="291.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">GND</text>

<text x="138.6" y="392.9" font-size="12" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#566070">Read()</text>
<text x="32" y="449.6" font-size="12.5" fill="#566070">* Not confirmed in the datasheet: pin 1 A-SET: the manual does not say whether an unused pin may float; pin 2</text>
<text x="32" y="467.6" font-size="12.5" fill="#566070">A-OUT: the manual does not say whether an unused pin may float.</text>

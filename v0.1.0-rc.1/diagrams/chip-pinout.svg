<text x="210" y="359.6" font-size="14" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#0E1726">RX/B</text>
<text x="138.6" y="358.9" font-size="12" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#566070">Write()</text>
<text x="235" y="392.7" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1E429F">6</text>

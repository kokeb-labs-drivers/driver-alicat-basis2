<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="810" viewBox="0 0 1016 810" role="img" aria-labelledby="chip-circuit-rs232-title chip-circuit-rs232-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-rs232-title">BASIS 2 (B and BC series): RS-232 point to point</title>
<desc id="chip-circuit-rs232-desc">Schematic of the BASIS 2 (B and BC series) rs-232 point to point: the chip with U2 MCU, U3 RS-232 level shifter, C1 capacitor 100 nF, J1 12 to 24 V supply; the MCU wires carry the port hooks Read(), Write().</desc>
<rect x="0.5" y="0.5" width="1015" height="809" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">BASIS 2 (B and BC series): RS-232 point to point</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">One instrument on an RS-232 port. The instrument's levels are RS-232, so a TTL UART needs a level shifter. The shifter is</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">general practice: the manual gives no TTL option. The MCU's TX goes to pin 5 (the instrument receives) and the MCU's RX to</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">pin 6. This is unverified: the manual's pin table lists "Rx" and "Tx" without saying whose side they name. Above each MCU</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">wire: the port hook that drives it. Datasheet: Power and Signal Connections, pin table, p. 7.</text>

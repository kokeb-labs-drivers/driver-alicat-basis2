<text x="152" y="162.8" font-size="13" font-weight="700" fill="#E2E8F0">BASIS 2 (B AND BC SERIES)</text>
<text x="347.6" y="162.8" font-size="12" fill="#E2E8F0">JST GH 6-pin connector</text>
<text x="196" y="228.6" font-size="15" font-weight="700" fill="#BFDBFE">Serial interface</text>
<text x="196" y="253.4" font-size="13" fill="#D2DAE4">ASCII and Modbus RTU,</text>
<text x="196" y="272.2" font-size="13" fill="#D2DAE4">38400 8N1</text>
<text x="524" y="228.6" font-size="15" font-weight="700" fill="#E2E8F0">Command processor*</text>
<text x="524" y="253.4" font-size="13" fill="#D2DAE4">DV, S, HPUR, V, GS, T</text>
<text x="852" y="228.6" font-size="15" font-weight="700" fill="#A7F3E6">Thermal flow sensor*</text>
<text x="852" y="253.4" font-size="13" fill="#D2DAE4">flow, temperature, totalizer,</text>
<text x="852" y="272.2" font-size="13" fill="#D2DAE4">9 gases</text>
<text x="524" y="364.6" font-size="15" font-weight="700" fill="#FDE68A">Loop control and</text>
<text x="524" y="384.1" font-size="15" font-weight="700" fill="#FDE68A">valve*</text>
<text x="524" y="408.9" font-size="13" fill="#D2DAE4">setpoint, ramp, watchdog,</text>
<text x="524" y="427.8" font-size="13" fill="#D2DAE4">normally closed</text>
<text x="196" y="364.6" font-size="15" font-weight="700" fill="#DDD6FE">Analog I/O</text>
<text x="196" y="389.4" font-size="13" fill="#D2DAE4">0-5 V or 4-20 mA by model</text>
<text x="852" y="364.6" font-size="15" font-weight="700" fill="#E2E8F0">Supply and status LED</text>
<text x="852" y="389.4" font-size="13" fill="#D2DAE4">12 to 24 V on pin 4</text>
<text x="122" y="238.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">RX/B  5</text>
<text x="122" y="262.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">TX/A  6</text>
<text x="122" y="382.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">A-SET*  1</text>
<text x="122" y="406.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#E8EDF3">A-OUT*  2</text>
<text x="1102" y="382.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">PWR  4</text>
<text x="1102" y="406.3" font-size="12.5" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">GND  3</text>

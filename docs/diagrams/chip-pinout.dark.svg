<svg xmlns="http://www.w3.org/2000/svg" width="760" height="533" viewBox="0 0 760 533" role="img" aria-labelledby="chip-pinout-title chip-pinout-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-pinout-title">BASIS 2 (B and BC series) pinout, JST GH 6-pin connector</title>
<desc id="chip-pinout-desc">Pinout of the BASIS 2 (B and BC series) in JST GH 6-pin connector, top view: 6 pins, each with its name, its electrical type as a colour and the driver hook that uses it.</desc>
<rect x="0.5" y="0.5" width="759" height="532" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">BASIS 2 (B and BC series) pinout, JST GH 6-pin connector</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Top view, pin 1 marked. Colour is the pin's electrical type; the mono text outside is the port</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">hook the driver uses for it. Datasheet: Power and Signal Connections, pin table, p. 7.</text>
<rect x="32" y="141.6" width="696" height="1" fill="#252F3C"/>

<text x="50" y="658.3" font-size="17" fill="#9F1239">+24V: PWR; also J1.24V · +3V3 (no BASIS 2 pin): U2.VDD, U3.VCC · GND: GND; also U2.GND, U3.GND, J1.GND</text>
<text x="50" y="727.9" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="751.4" font-size="17" fill="#334155">Not wired in this circuit (2): A-OUT, A-SET.</text>
<text x="32" y="797.4" font-size="16" fill="#566070">* Not confirmed in the datasheet: net +3V3: the transceiver runs from the MCU's supply: general practice; U3: the transceiver is general</text>
<text x="32" y="820.4" font-size="16" fill="#566070">practice: the manual describes none.</text>

<text x="50" y="469.9" font-size="17" fill="#9F1239">+24V: PWR; also J1.24V · GND: GND; also U2.GND, J1.GND</text>
<text x="50" y="539.5" font-size="20" font-weight="700" fill="#334155">Also on the board</text>

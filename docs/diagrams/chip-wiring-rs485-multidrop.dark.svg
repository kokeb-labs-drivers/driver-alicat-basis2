<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-labelledby="chip-wiring-rs485-multidrop-title chip-wiring-rs485-multidrop-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-rs485-multidrop-title">Wiring: RS-485 multidrop line</title>
<desc id="chip-wiring-rs485-multidrop-desc">Wiring of the BASIS 2 for the RS-485 multidrop line: MCU + RS-485 RS-485 A to TX/A (Read()); MCU + RS-485 RS-485 B to RX/B (Write()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="675" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">Wiring: RS-485 multidrop line</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">Hardware page. Datasheet: Power and Signal Connections, pin table, p. 7.</text>

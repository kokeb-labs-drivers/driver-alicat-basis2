<svg xmlns="http://www.w3.org/2000/svg" width="640" height="785" viewBox="0 0 640 785" role="img" aria-labelledby="rs485-topology-title rs485-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="rs485-topology-title">Several BASIS 2 on one RS-485 line</title>
<desc id="rs485-topology-desc">An RS-485 line on which an MCU and up to 26 BASIS 2 instruments share the B (+) and A (-) wires, each answering to its own unit ID in ASCII or its own Modbus address in Modbus RTU.</desc>
<style>

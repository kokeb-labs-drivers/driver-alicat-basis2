<path d="M488.8 234.4 L584.7 234.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M488.8 326.4 L584.7 326.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<path d="M488.8 418.4 L584.7 418.4" fill="none" stroke-width="1.8" stroke-dasharray="5 4" class="fk-s-ink2"/>
<path d="M488.8 510.4 L584.7 510.4" fill="none" stroke-width="1.8" class="fk-s-ink2"/>
<rect x="32" y="208.4" width="456.8" height="74" rx="10" stroke-width="1.4" class="fk-f-blue-tint fk-s-blue-strong"/>
<rect x="32" y="216.4" width="4" height="58" rx="2" class="fk-f-blue-strong"/>
<rect x="32" y="300.4" width="456.8" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>

<rect x="0.5" y="0.5" width="639" height="784" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" class="fk-f-brand-text">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" class="fk-f-ink">Several BASIS 2 on one RS-485 line</text>
<text x="32" y="102.7" font-size="15" class="fk-f-muted">Datasheet: Power and Signal Connections, pin table, p. 7; Unit ID, p. 16;</text>
<text x="32" y="124.5" font-size="15" class="fk-f-muted">Modbus-RTU, Modbus Address, p. 18; Alicat ASCII Serial Communication,</text>
<text x="32" y="146.2" font-size="15" class="fk-f-muted">Establishing Communication, p. 10.</text>
<rect x="32" y="162.2" width="576" height="1" class="fk-f-hair"/>

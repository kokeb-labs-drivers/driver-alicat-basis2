<rect x="32" y="484.4" width="456.8" height="74" rx="10" stroke-width="1.4" class="fk-f-teal-tint fk-s-teal-strong"/>
<rect x="32" y="492.4" width="4" height="58" rx="2" class="fk-f-teal-strong"/>
<rect x="32" y="580.4" width="576" height="173.8" rx="10" stroke-width="1" class="fk-f-slate-tint fk-s-slate-soft"/>
<text x="52" y="236.8" font-size="17" font-weight="700" class="fk-f-blue-text">MCU</text>
<text x="52" y="264.6" font-size="15" class="fk-f-ink2">UART and RS-485 transceiver</text>
<text x="52" y="328.8" font-size="17" font-weight="700" class="fk-f-teal-text">BASIS 2</text>
<text x="52" y="356.6" font-size="15" class="fk-f-ink2">unit ID A, Modbus 1</text>
<text x="52" y="420.8" font-size="17" font-weight="700" class="fk-f-ink">…</text>
<text x="52" y="448.6" font-size="15" class="fk-f-ink2">unit IDs B to Y</text>
<text x="52" y="512.8" font-size="17" font-weight="700" class="fk-f-teal-text">BASIS 2</text>
<text x="52" y="540.6" font-size="15" class="fk-f-ink2">unit ID Z, Modbus 247</text>
<text x="538.1" y="208.4" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">B (+)</text>
<circle cx="538.1" cy="224.4" r="3.6" class="fk-f-ink2"/>
<circle cx="538.1" cy="316.4" r="3.6" class="fk-f-ink2"/>
<circle cx="538.1" cy="408.4" r="3.6" class="fk-f-ink2"/>
<circle cx="538.1" cy="500.4" r="3.6" class="fk-f-ink2"/>
<text x="584.7" y="208.4" font-size="14" font-weight="700" text-anchor="middle" class="fk-f-ink">A (-)</text>
<circle cx="584.7" cy="234.4" r="3.6" class="fk-f-ink2"/>
<circle cx="584.7" cy="326.4" r="3.6" class="fk-f-ink2"/>
<circle cx="584.7" cy="418.4" r="3.6" class="fk-f-ink2"/>
<circle cx="584.7" cy="510.4" r="3.6" class="fk-f-ink2"/>
<text x="46" y="608.8" font-size="17" font-weight="700" class="fk-f-slate-text">Limits</text>
<text x="46" y="629.2" font-size="15" class="fk-f-slate-text">Up to 26 instruments on one COM port (Alicat ASCII Serial</text>
<text x="46" y="651" font-size="15" class="fk-f-slate-text">Communication, Establishing Communication, p. 10). Unit IDs A to Z, one</text>
<text x="46" y="672.8" font-size="15" class="fk-f-slate-text">per instrument; A is the default (Unit ID, p. 16). Modbus addresses 1 to</text>
<text x="46" y="694.5" font-size="15" class="fk-f-slate-text">247, one per instrument (Modbus-RTU, Modbus Address, p. 18). RS-485</text>
<text x="46" y="716.2" font-size="15" class="fk-f-slate-text">B (+) on pin 5, A (-) on pin 6 (Power and Signal Connections, pin table, p.</text>
<text x="46" y="738" font-size="15" class="fk-f-slate-text">7).</text>
</svg>

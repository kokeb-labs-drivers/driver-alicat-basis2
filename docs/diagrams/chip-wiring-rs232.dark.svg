<text x="417.5" y="387.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Read()</text>
<text x="625.5" y="306.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#DDD6FE">T1OUT</text>
<text x="824.5" y="306.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">RX/B</text>
<rect x="788.5" y="294.3" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="716" y="290.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">To RX  pin 5</text>
<text x="716" y="323.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Write()</text>
<text x="625.5" y="370.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#DDD6FE">R1IN</text>
<text x="824.5" y="370.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">TX/A</text>
<rect x="788.5" y="358.3" width="14" height="12" rx="2" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="716" y="354.3" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">From TX  pin 6</text>
<text x="716" y="387.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">Read()</text>
<text x="50" y="485.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="508.8" font-size="17" fill="#FECDD3">+24V: PWR; also J1.24V · +3V3 (no BASIS 2 pin): U2.VDD, U3.VCC · GND: GND; also U2.GND, U3.GND, J1.GND</text>
<text x="50" y="578.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="601.8" font-size="17" fill="#E2E8F0">Not wired in this circuit (2): A-OUT, A-SET.</text>
<text x="32" y="647.8" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: net +3V3: the level shifter runs from the MCU's supply: general practice; U3: the level shifter is general</text>
<text x="32" y="670.8" font-size="16" fill="#9AA6B5">practice: the manual describes none.</text>
<rect x="32" y="688" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>

<text x="32" y="349.3" font-size="17" font-weight="700" fill="#0E1726">Values</text>
<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">tIDLE</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" fill="#0E1726">min 3.5 byte times</text>
<text x="32" y="405.9" font-size="15" fill="#2B3442">Serial idle timeout after the carriage return, before the instrument acts</text>
<text x="32" y="426.1" font-size="14" fill="#566070">Datasheet Alicat ASCII Serial Communication, p. 10</text>
<text x="46" y="480.2" font-size="17" font-weight="700" fill="#334155">Notes</text>
<text x="46" y="500.7" font-size="15" fill="#334155">Every command and every reply ends with a carriage return (13, 0x0D).</text>
<text x="46" y="522.4" font-size="15" fill="#334155">Polling with only the unit ID returns the whole data frame. Do not start a</text>
<text x="46" y="544.2" font-size="15" fill="#334155">new command before the reply's carriage return has arrived.</text>

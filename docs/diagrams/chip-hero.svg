<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">BASIS 2</title>
<desc id="chip-hero-desc">Overview of the BASIS 2, a family of gas mass flow meters (B series) and controllers (BC series): it reports the flow, temperature and total of nine gases, and a controller sets the flow with its own valve. A MCU talks to it over RS-232 or RS-485; it drives Valve; it reads back Gas flow, Gas temperature. Headline figures: 12 to 24 V supply on pin 4 only; 1000:1 turndown, 0.1 to 100 % of full scale; 9 gases selectable, stored in the instrument; 176 Hz digital update rate at best.</desc>

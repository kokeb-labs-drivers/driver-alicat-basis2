<path d="M488.8 500.4 L538.1 500.4" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M584.7 216.4 L584.7 550.4" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>
<path d="M488.8 234.4 L584.7 234.4" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M488.8 326.4 L584.7 326.4" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<path d="M488.8 418.4 L584.7 418.4" fill="none" stroke="#D2DAE4" stroke-width="1.8" stroke-dasharray="5 4"/>
<path d="M488.8 510.4 L584.7 510.4" fill="none" stroke="#D2DAE4" stroke-width="1.8"/>
<rect x="32" y="208.4" width="456.8" height="74" rx="10" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<rect x="32" y="216.4" width="4" height="58" rx="2" fill="#60A5FA"/>
<rect x="32" y="300.4" width="456.8" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="308.4" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="392.4" width="456.8" height="74" rx="10" fill="#151C26" stroke="#6C7889" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="484.4" width="456.8" height="74" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="32" y="492.4" width="4" height="58" rx="2" fill="#2BB3A3"/>
<rect x="32" y="580.4" width="576" height="173.8" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="52" y="236.8" font-size="17" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="52" y="264.6" font-size="15" fill="#D2DAE4">UART and RS-485 transceiver</text>
<text x="52" y="328.8" font-size="17" font-weight="700" fill="#A7F3E6">BASIS 2</text>
<text x="52" y="356.6" font-size="15" fill="#D2DAE4">unit ID A, Modbus 1</text>
<text x="52" y="420.8" font-size="17" font-weight="700" fill="#E8EDF3">…</text>
<text x="52" y="448.6" font-size="15" fill="#D2DAE4">unit IDs B to Y</text>
<text x="52" y="512.8" font-size="17" font-weight="700" fill="#A7F3E6">BASIS 2</text>
<text x="52" y="540.6" font-size="15" fill="#D2DAE4">unit ID Z, Modbus 247</text>
<text x="538.1" y="208.4" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">B (+)</text>
<circle cx="538.1" cy="224.4" r="3.6" fill="#D2DAE4"/>
<circle cx="538.1" cy="316.4" r="3.6" fill="#D2DAE4"/>
<circle cx="538.1" cy="408.4" r="3.6" fill="#D2DAE4"/>
<circle cx="538.1" cy="500.4" r="3.6" fill="#D2DAE4"/>
<text x="584.7" y="208.4" font-size="14" font-weight="700" text-anchor="middle" fill="#E8EDF3">A (-)</text>
<circle cx="584.7" cy="234.4" r="3.6" fill="#D2DAE4"/>
<circle cx="584.7" cy="326.4" r="3.6" fill="#D2DAE4"/>
<circle cx="584.7" cy="418.4" r="3.6" fill="#D2DAE4"/>
<circle cx="584.7" cy="510.4" r="3.6" fill="#D2DAE4"/>
<text x="46" y="608.8" font-size="17" font-weight="700" fill="#E2E8F0">Limits</text>
<text x="46" y="629.2" font-size="15" fill="#E2E8F0">Up to 26 instruments on one COM port (Alicat ASCII Serial</text>
<text x="46" y="651" font-size="15" fill="#E2E8F0">Communication, Establishing Communication, p. 10). Unit IDs A to Z, one</text>
<text x="46" y="672.8" font-size="15" fill="#E2E8F0">per instrument; A is the default (Unit ID, p. 16). Modbus addresses 1 to</text>
<text x="46" y="694.5" font-size="15" fill="#E2E8F0">247, one per instrument (Modbus-RTU, Modbus Address, p. 18). RS-485</text>
<text x="46" y="716.2" font-size="15" fill="#E2E8F0">B (+) on pin 5, A (-) on pin 6 (Power and Signal Connections, pin table, p.</text>
<text x="46" y="738" font-size="15" fill="#E2E8F0">7).</text>
</svg>

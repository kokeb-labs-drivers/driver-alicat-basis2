<svg xmlns="http://www.w3.org/2000/svg" width="640" height="785" viewBox="0 0 640 785" role="img" aria-labelledby="rs485-topology-title rs485-topology-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="rs485-topology-title">Several BASIS 2 on one RS-485 line</title>
<desc id="rs485-topology-desc">An RS-485 line on which an MCU and up to 26 BASIS 2 instruments share the B (+) and A (-) wires, each answering to its own unit ID in ASCII or its own Modbus address in Modbus RTU.</desc>
<rect x="0.5" y="0.5" width="639" height="784" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SEVERAL DEVICES</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">Several BASIS 2 on one RS-485 line</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: Power and Signal Connections, pin table, p. 7; Unit ID, p. 16;</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">Modbus-RTU, Modbus Address, p. 18; Alicat ASCII Serial Communication,</text>
<text x="32" y="146.2" font-size="15" fill="#9AA6B5">Establishing Communication, p. 10.</text>
<rect x="32" y="162.2" width="576" height="1" fill="#252F3C"/>
<path d="M538.1 216.4 L538.1 550.4" fill="none" stroke="#D2DAE4" stroke-width="2.2"/>

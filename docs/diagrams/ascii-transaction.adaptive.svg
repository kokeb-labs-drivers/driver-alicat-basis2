<svg xmlns="http://www.w3.org/2000/svg" width="640" height="591" viewBox="0 0 640 591" role="img" aria-labelledby="ascii-transaction-title ascii-transaction-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="ascii-transaction-title">ASCII poll of the data frame</title>
<desc id="ascii-transaction-desc">One ASCII poll of a BASIS 2: the host sends the unit ID and a carriage return, the line stays idle for the serial idle timeout, and the instrument answers with one line of the data frame ended by a carriage return.</desc>

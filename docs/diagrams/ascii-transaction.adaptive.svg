<text x="32" y="385.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tIDLE</text>
<text x="608" y="385.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 3.5 byte times</text>
<text x="32" y="405.9" font-size="15" class="fk-f-ink2">Serial idle timeout after the carriage return, before the instrument acts</text>
<text x="32" y="426.1" font-size="14" class="fk-f-muted">Datasheet Alicat ASCII Serial Communication, p. 10</text>
<text x="46" y="480.2" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="500.7" font-size="15" class="fk-f-slate-text">Every command and every reply ends with a carriage return (13, 0x0D).</text>
<text x="46" y="522.4" font-size="15" class="fk-f-slate-text">Polling with only the unit ID returns the whole data frame. Do not start a</text>
<text x="46" y="544.2" font-size="15" class="fk-f-slate-text">new command before the reply's carriage return has arrived.</text>

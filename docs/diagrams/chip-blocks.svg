<text x="32" y="503.8" font-size="12.5" fill="#566070">* Not confirmed in the datasheet: Command processor: the manual has no block diagram; Thermal flow sensor: the manual has no block diagram; Loop control and valve: the manual</text>
<text x="32" y="521.8" font-size="12.5" fill="#566070">has no block diagram; controllers only; pin A-SET: the manual does not say whether an unused pin may float; pin A-OUT: the manual does not say whether an unused pin may float.</text>

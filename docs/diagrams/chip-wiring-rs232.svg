<text x="922.5" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">BASIS 2</text>
<text x="922.5" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="175.5" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="175.5" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="477.5" y="258.3" font-size="16" font-weight="700" fill="#5B21B6">RS-232 level shifter</text>
<text x="339.5" y="306.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">UART TX</text>
<text x="495.5" y="306.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#5B21B6">T1IN</text>
<text x="417.5" y="290.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">MCU TX</text>
<text x="417.5" y="323.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write()</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="511" viewBox="0 0 1016 511" role="img" aria-labelledby="chip-circuit-rs485-multidrop-title chip-circuit-rs485-multidrop-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-rs485-multidrop-title">BASIS 2: RS-485 multidrop line</title>
<desc id="chip-circuit-rs485-multidrop-desc">Schematic of the BASIS 2 rs-485 multidrop line: the chip with U2 MCU + RS-485, J1 12 to 24 V supply; the MCU wires carry the port hooks Read(), Write().</desc>
<rect x="0.5" y="0.5" width="1015" height="510" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">BASIS 2: RS-485 multidrop line</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Up to 26 instruments with unit IDs A to Z on one pair. The MCU's UART reaches the pair through a half-duplex transceiver,</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">drawn with the MCU, whose A and B lines meet pins 6 and 5 of each instrument; the grounds are common on pin 3. The</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">transceiver (its supply, ground and direction pins are not drawn) and the 120 ohm terminations at both ends of the line (not</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">drawn) are general practice, not manual values. Only pin 4 carries power. Above each MCU wire: the port hook that drives it.</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">Datasheet: Power and Signal Connections, pin table, p. 7.</text>

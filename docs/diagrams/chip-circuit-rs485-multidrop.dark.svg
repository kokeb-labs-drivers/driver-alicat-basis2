<svg xmlns="http://www.w3.org/2000/svg" width="928" height="809" viewBox="0 0 928 809" role="img" aria-labelledby="chip-circuit-rs485-multidrop-title chip-circuit-rs485-multidrop-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-rs485-multidrop-title">BASIS 2: RS-485 multidrop line</title>
<desc id="chip-circuit-rs485-multidrop-desc">Schematic of the BASIS 2 rs-485 multidrop line: the chip with U2 MCU, U3 RS-485 transceiver, J1 12 to 24 V supply; the MCU wires carry the port hooks Write().</desc>
<rect x="0.5" y="0.5" width="927" height="808" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">BASIS 2: RS-485 multidrop line</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">Up to 26 instruments with unit IDs A to Z on one pair. The MCU's UART reaches the pair through a half-duplex</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">RS-485 transceiver: TX to DI, RO to RX, and one GPIO on DE and /RE tied together, which Write() raises while it</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">sends and lowers after the last stop bit. The transceiver's A and B lines meet pins 6 and 5 of each instrument; the</text>
<text x="32" y="169.1" font-size="15" fill="#9AA6B5">grounds are common on pin 3. The transceiver and the 120 ohm terminations at both ends of the line (not drawn)</text>
<text x="32" y="190.8" font-size="15" fill="#9AA6B5">are general practice, not manual values. Only pin 4 carries power. Above each MCU wire: the port hook that drives</text>
<text x="32" y="212.6" font-size="15" fill="#9AA6B5">it. Datasheet: Power and Signal Connections, pin table, p. 7.</text>
<rect x="32" y="228.6" width="864" height="1" fill="#252F3C"/>

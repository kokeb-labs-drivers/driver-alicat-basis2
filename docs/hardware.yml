---
# The hardware of the BASIS 2 instruments in one file: connector, pins, the driver hook of each pin, the blocks
# inside and two reference circuits. `kokeb-docs figures` draws the pinout, the module outline, the block diagram and
# the circuits from it, `kokeb-docs gen` writes the chip card of the README and the tables of docs/hardware.md, and
# `kokeb-docs hardware --check` validates it. Schema: docs/chip-diagrams.md in kokeb-labs/ci-tools.
#
# The instrument is a module with one six-pin JST GH connector, not a package with leads. The figure system has no
# module view, so the connector is drawn as one row of pins (the manual's own drawing is one row) and the outline is
# the plan view of the smallest size class (no pin pitch: the JST GH family's 1.25 mm is not stated by the manual or
# the sheet). The other size classes are listed as variants. Every fact cites the
# manual (document `manual`, Rev 4) or the specification sheet (document `specs`, Rev 19). A fact no document states
# is marked `unverified` with the reason.
schema: 1
chip: "BASIS 2"

refs:
  pinout: {doc: manual, section: "Power and Signal Connections, pin table", page: 7}
  supply: {doc: manual, section: "Power and Signal Connections", page: 6}
  serial: {doc: manual, section: "Alicat ASCII Serial Communication, Establishing Communication", page: 10}
  baud: {doc: manual, section: "Serial Baud Rate", page: 17}
  analog: {doc: manual, section: "Analog Signals", page: 28}
  tare: {doc: manual, section: "Using Ground to Tare (Meters)", page: 15}
  led: {doc: manual, section: "Getting Started, Mounting", page: 5}
  outline: {doc: specs, section: "Dimensions", page: 3}
  order: {doc: specs, section: "Technical Data, ranges and options", page: 2}
  electrical: {doc: specs, section: "Technical Data", page: 1}
  blocks: {doc: manual, section: "Introduction", page: 3}
  power: {doc: manual, section: "Power and Signal Connections", page: 6}
  frame: {doc: manual, section: "Data Frame Format", page: 10}
  setpoint: {doc: manual, section: "Setpoint; Setpoint Source; Maximum Setpoint Ramp Rate", page: 11}
  valve: {doc: manual, section: "Hold Valve Position / Resume Flow; Loop Control Gains", page: 13}
  measure: {doc: manual, section: "Configure Measurement Triggering; Measurement Averages and Ranges", page: 13}
  taring: {doc: manual, section: "Taring the Instrument", page: 14}
  gas: {doc: manual, section: "Active Gas", page: 15}
  totalizer: {doc: manual, section: "Totalizer Reset; Totalizer Batch; Totalizer Configuration", page: 15}
  unitid: {doc: manual, section: "Unit ID", page: 16}

package:
  type: "JST GH 6-pin connector"
  layout: dual
  pins: 6
  sides: {left: [1, 2, 3, 4, 5, 6]}
  ref: pinout
  # The plan view of the smallest size class (100 SCCM to 2 SLPM): length along the flow, depth, height. No pitch is
  # given: the JST GH family's is 1.25 mm, but neither the manual nor the sheet states it (unverified, so left out).
  outline: {length_mm: 68.6, width_mm: 22.2, height_mm: 39.4, ref: outline}
  variants:
    - {id: a, type: "Size class a: 100 SCCM to 2 SLPM", pins: 6, size: "68.6 x 22.2 x 39.4 mm, about 116 g",
       ordering: "1/8 in NPT female or SAE 4", ref: outline}
    - {id: b, type: "Size class b: 5 to 20 SLPM", pins: 6, size: "84.0 x 25.4 x 45.7 mm, about 171 g",
       ordering: "3/8 in NPT female or SAE 6", ref: outline}
    - {id: c, type: "Size class c: 50 to 100 SLPM meter", pins: 6, size: "95.3 x 35.0 x 48.4 mm, about 270 g",
       ordering: "3/8 in NPT female or SAE 6", ref: outline}
    - {id: d, type: "Size class d: 50 to 100 SLPM controller", pins: 6, size: "114.8 x 35.0 x 52.3 mm, about 350 g",
       ordering: "3/8 in NPT female or SAE 6",
       note: "options by model, not by size: analog 0-5 V or 4-20 mA; serial RS-232, RS-485 or Modbus RTU",
       ref: outline}

supply:
  - {name: PWR, min_v: 12, max_v: 24, ref: supply}

# The chip-first README: what the instrument is and does, where it is used, how the driver covers each function.
# `kokeb-docs figures` draws chip-hero and chip-capabilities from it, `kokeb-docs gen` the README's chip-summary,
# chip-uses and chip-coverage regions. The line is a variable-length ASCII or Modbus RTU exchange, so there is no
# `frames` entry.
overview:
  summary: >-
    a family of gas mass flow meters (B series) and controllers (BC series): it reports the flow, temperature and
    total of nine gases, and a controller sets the flow with its own valve
  category: Gas mass flow meter and controller
  ref: blocks
  applications:
    - Logging flow data to a PC over the serial line
    - Flow control from software, over a digital link or with analog signals
  specs:
    - {value: "12 to 24 V", label: "supply on pin 4 only", ref: power}
    - {value: "1000:1", label: "turndown, 0.1 to 100 % of full scale", ref: electrical}
    - {value: "9 gases", label: "selectable, stored in the instrument", ref: gas}
    - {value: "176 Hz", label: "digital update rate at best", ref: electrical}
  system:
    host: MCU
    bus: "RS-232 or RS-485"
    drives:
      - {label: Valve, detail: "controllers only, normally closed", ref: electrical}
    senses:
      - {label: Gas flow, detail: "mass flow, 0.1 to 100 % of full scale", ref: electrical}
      - {label: Gas temperature, detail: "within 1.5 degrees C", ref: electrical}

# Headers the capability `api` and `registers` names are checked against.
driver:
  api: [inc/alicat_basis2.hpp, inc/alicat_basis2_types.hpp]
  registers: [inc/alicat_basis2_registers.hpp]

capabilities:
  - {id: flow, title: "Flow, temperature and total", icon: flow, status: supported, ref: frame, docs: api-guide.md,
     what: "Polls the whole data frame or single items and decodes each number exactly",
     api: [ReadFrame, ReadData, ReadFlow, ReadTemperature, ReadTotal, ReadStatus],
     registers: [kFlow, kTemperature, kTotal, kStatus]}
  - {id: setpoint, title: "Setpoint, ramp and watchdog", icon: ramp, status: supported, ref: setpoint,
     docs: safety.md,
     what: "Sets the flow of a controller, limits how fast it changes and closes the valve if the line goes quiet",
     note: "controllers only; the watchdog acts only on Modbus setpoints from an unsaved digital source",
     api: [SetSetpoint, SetSetpointSource, SetRamp, DisableRamp, SetWatchdog],
     registers: [kSetpoint, kSetpointType, kRamp, kWatchdog]}
  - {id: valve, title: Valve hold and loop gains, icon: gate, status: supported, ref: valve, docs: safety.md,
     what: "Holds the valve at a fixed drive, opens or closes it, and tunes the closed loop",
     note: "controllers only",
     api: [HoldValve, ResumeControl, OpenValve, CloseValve, SetGains],
     registers: [kGainP, kGainI]}
  - {id: tare, title: Tare and autotare, icon: gauge, status: supported, ref: taring, docs: api-guide.md,
     what: "Zeroes the flow reading at no flow, and on a controller zeroes it again at a closed setpoint",
     api: [Tare, TareDefault, SetAutotare],
     registers: [kTare, kTareSamples, kAutotare]}
  - {id: gas, title: Gas selection, icon: tag, status: supported, ref: gas, docs: api-guide.md,
     what: "Selects one of the nine calibrated gases and lists the gases the instrument holds",
     api: [SetGas, ReadGas, ReadGasList, ReadGasTable],
     registers: [kGas, kGasTable]}
  - {id: totalizer, title: Totalizer and batch, icon: memory, status: supported, ref: totalizer, docs: api-guide.md,
     what: "Counts the gas that has passed, sets what happens at the limit, and dispenses a set volume",
     note: "batch on controllers only",
     api: [ResetTotal, SetTotalizerLimit, SetBatch, DisableBatch, ReadBatchRemaining],
     registers: [kTotalReset, kTotalLimit, kBatch, kBatchRemaining]}
  - {id: window, title: Measurement window, icon: clock, status: supported, ref: measure, docs: api-guide.md,
     what: "Starts a timed measurement, by command or by an event, and reads its averages and ranges",
     note: "controllers only",
     api: [SetMeasurementTrigger, StartMeasurement, ReadAverages, ReadRanges, ReadPreviousMeasurement],
     registers: [kTrigger, kSamples]}
  - {id: identity, title: "Unit ID, baud and protocol", icon: lock, status: guarded, ref: unitid, docs: safety.md,
     what: "Changes the unit ID, address, baud rate or protocol, restores factory settings, and scans a line",
     note: "each change needs a confirmation token",
     api: [ChangeUnitId, SetModbusAddress, ChangeBaud, SwitchToProtocol1, FactoryRestore, ScanUnitIds],
     registers: [kUnitId, kModbusAddress, kBaud, kProtocol, kFactoryRestore]}
  - {id: analog, title: Analog setpoint and output, icon: analog, status: not-covered, ref: analog, docs: hardware.md,
     what: "A 0 to 5 V or 4 to 20 mA setpoint input and flow output on pins 1 and 2, wired outside the driver"}

hooks:
  - {id: write, call: "Write()", kind: uart, source: inc/alicat_basis2_uart_interface.hpp, symbol: Write}
  - {id: read, call: "Read()", kind: uart, source: inc/alicat_basis2_uart_interface.hpp, symbol: Read}

pins:
  - {number: 1, name: A-SET, type: analog, domain: SIGNAL,
     function: "Analog setpoint input (controllers); on a meter, ground this pin for at least 25 ms to tare",
     unused: Leave open, ref: tare,
     unverified: "the manual does not say whether an unused pin may float"}
  - {number: 2, name: A-OUT, type: analog, domain: SIGNAL,
     function: "Analog flow output, 0 to 5 V or 4 to 20 mA by model",
     unused: Leave open, ref: analog,
     unverified: "the manual does not say whether an unused pin may float"}
  - {number: 3, name: GND, type: ground, domain: GND, function: "Ground, common to power, analog and serial",
     ref: pinout}
  - {number: 4, name: PWR, type: power, domain: PWR,
     function: "Power in, 12 to 24 V. Power on any other pin can permanently damage the instrument", ref: supply}
  - {number: 5, name: RX/B, type: bus, domain: SIGNAL,
     function: "RS-232 receive (the instrument receives, unverified: the manual does not say whose side Rx names)
       or RS-485 B (+), by model", hook: write, ref: pinout}
  - {number: 6, name: TX/A, type: bus, domain: SIGNAL,
     function: "RS-232 transmit (the instrument transmits, unverified: the manual does not say whose side Tx names)
       or RS-485 A (-), by model", hook: read, ref: pinout}

block_diagram:
  ref: blocks
  blocks:
    - {id: serial, label: Serial interface, detail: "ASCII and Modbus RTU, 38400 8N1", at: [0, 0], tone: blue,
       pins: [RX/B, TX/A], ref: serial}
    - {id: proc, label: Command processor, detail: "DV, S, HPUR, V, GS, T", at: [1, 0], tone: slate,
       unverified: "the manual has no block diagram"}
    - {id: sensor, label: Thermal flow sensor, detail: "flow, temperature, totalizer, 9 gases", at: [2, 0], tone: teal,
       unverified: "the manual has no block diagram"}
    - {id: ctrl, label: Loop control and valve, detail: "setpoint, ramp, watchdog, normally closed", at: [1, 1],
       tone: amber, unverified: "the manual has no block diagram; controllers only"}
    - {id: analog, label: Analog I/O, detail: "0-5 V or 4-20 mA by model", at: [0, 1], tone: violet,
       pins: [A-SET, A-OUT], ref: analog}
    - {id: power, label: Supply and status LED, detail: "12 to 24 V on pin 4", at: [2, 1], tone: slate,
       pins: [PWR, GND], ref: led}
  links:
    - {from: serial, to: proc, label: frames, both: true}
    - {from: sensor, to: proc, label: readings}
    - {from: proc, to: ctrl, label: setpoint}
    - {from: analog, to: ctrl, label: setpoint}

circuits:
  - id: rs485-multidrop
    title: RS-485 multidrop line
    description: >-
      Up to 26 instruments with unit IDs A to Z on one pair. The MCU's UART reaches the pair through a half-duplex
      RS-485 transceiver: TX to DI, RO to RX, and one GPIO on DE and /RE tied together, which Write() raises while
      it sends and lowers after the last stop bit. The transceiver's A and B lines meet pins 6 and 5 of each
      instrument; the grounds are common on pin 3. The transceiver and the 120 ohm terminations at both ends of the
      line (not drawn) are general practice, not manual values. Only pin 4 carries power.
    ref: pinout
    parts:
      - {id: U1, kind: chip}
      - id: U2
        kind: mcu
        label: MCU
        pins:
          - {name: TX, label: UART TX}
          - {name: RX, label: UART RX}
          - {name: DIR, label: GPIO (direction)}
          - VDD
          - GND
      - id: U3
        kind: ic
        label: RS-485 transceiver
        pins: [VCC, DI, RO, DE, RE, B, A, GND]
        unverified: "the transceiver is general practice: the manual describes none"
      - {id: J1, kind: connector, label: "12 to 24 V supply", ref: supply, pins: ["24V", GND]}
    nets:
      - {name: "+24V", kind: supply, nodes: [U1.PWR, J1.24V]}
      - {name: "+3V3", kind: supply, nodes: [U2.VDD, U3.VCC],
         unverified: "the transceiver runs from the MCU's supply: general practice"}
      - {name: GND, kind: ground, nodes: [U2.GND, U3.GND, U1.GND, J1.GND]}
      - {name: TXD, nodes: [U2.TX, U3.DI], hook: write}
      - {name: RXD, nodes: [U3.RO, U2.RX], hook: read}
      - {name: Direction, nodes: [U2.DIR, U3.DE, U3.RE], hook: write}
      - {name: "Line A", nodes: [U3.A, U1.TX/A], hook: [write, read]}
      - {name: "Line B", nodes: [U3.B, U1.RX/B], hook: [write, read]}
    unused: [U1.A-SET, U1.A-OUT]
  - id: rs232
    title: RS-232 point to point
    description: >-
      One instrument on an RS-232 port. The instrument's levels are RS-232, so a TTL UART needs a level shifter; the
      shifter is general practice: the manual gives no TTL option. The MCU's TX goes through the shifter to pin 5
      (the instrument receives) and pin 6 comes back through it to the MCU's RX. This is unverified: the manual's pin
      table lists "Rx" and "Tx" without saying whose side they name.
    ref: pinout
    parts:
      - {id: U1, kind: chip}
      - id: U2
        kind: mcu
        label: MCU
        pins:
          - {name: TX, label: UART TX}
          - {name: RX, label: UART RX}
          - VDD
          - GND
      - id: U3
        kind: ic
        label: RS-232 level shifter
        pins: [VCC, T1IN, R1OUT, R1IN, T1OUT, GND]
        unverified: "the level shifter is general practice: the manual describes none"
      - {id: J1, kind: connector, label: "12 to 24 V supply", ref: supply, pins: ["24V", GND]}
    nets:
      - {name: "+24V", kind: supply, nodes: [U1.PWR, J1.24V]}
      - {name: "+3V3", kind: supply, nodes: [U2.VDD, U3.VCC],
         unverified: "the level shifter runs from the MCU's supply: general practice"}
      - {name: GND, kind: ground, nodes: [U2.GND, U3.GND, U1.GND, J1.GND]}
      - {name: "MCU TX", nodes: [U2.TX, U3.T1IN], hook: write}
      - {name: "MCU RX", nodes: [U3.R1OUT, U2.RX], hook: read}
      - {name: "To RX", nodes: [U3.T1OUT, U1.RX/B]}
      - {name: "From TX", nodes: [U1.TX/A, U3.R1IN]}
    unused: [U1.A-SET, U1.A-OUT]
